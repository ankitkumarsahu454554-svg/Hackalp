<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="CYBERSENTINEL AI Icon">
  <defs>
    <linearGradient id="csShieldFill" x1="18" y1="10" x2="102" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#09101D"/>
    </linearGradient>
    <linearGradient id="csEdgeGrad" x1="16" y1="10" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="csCoreGlow" cx="60" cy="58" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09101D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Geometric Shield -->
  <path d="M60 8 L102 22 V55 C102 82.5 84.2 103.4 60 112 C35.8 103.4 18 82.5 18 55 V22 Z"
        fill="url(#csShieldFill)" stroke="url(#csEdgeGrad)" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Inner Structural Chamfer -->
  <path d="M60 15.5 L95 27.2 V54.5 C95 78.2 79.8 96.2 60 103.8 C40.2 96.2 25 78.2 25 54.5 V27.2 Z"
        stroke="#1E293B" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Subtle Core Illumination -->
  <circle cx="60" cy="58" r="32" fill="url(#csCoreGlow)"/>

  <!-- Radar / Temporal Pulse Rings -->
  <circle cx="60" cy="58" r="29" stroke="#00D4FF" stroke-opacity="0.25" stroke-width="1.1" stroke-dasharray="4 4"/>
  <path d="M36.5 44.5 A27 27 0 0 1 83.5 44.5" stroke="#00D4FF" stroke-opacity="0.72" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M41.5 76.5 A26 26 0 0 0 78.5 76.5" stroke="#8B5CF6" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Radar Sweep Vector -->
  <line x1="60" y1="58" x2="81" y2="39" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- Neural Network Hexagon & Synaptic Links -->
  <polygon points="60,39 76.5,48.5 76.5,67.5 60,77 43.5,67.5 43.5,48.5"
           stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.4" fill="#0B1628" fill-opacity="0.65"/>
  <line x1="60" y1="39" x2="60" y2="58" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="76.5" y1="48.5" x2="60" y2="58" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="76.5" y1="67.5" x2="60" y2="58" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="60" y1="77" x2="60" y2="58" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="43.5" y1="67.5" x2="60" y2="58" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.65"/>
  <line x1="43.5" y1="48.5" x2="60" y2="58" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.65"/>

  <!-- Neural Perimeter Nodes -->
  <circle cx="60" cy="39" r="2.6" fill="#E2E8F0"/>
  <circle cx="76.5" cy="48.5" r="2.4" fill="#00D4FF"/>
  <circle cx="76.5" cy="67.5" r="2.4" fill="#8B5CF6"/>
  <circle cx="60" cy="77" r="2.6" fill="#E2E8F0"/>
  <circle cx="43.5" cy="67.5" r="2.4" fill="#00D4FF"/>
  <circle cx="43.5" cy="48.5" r="2.4" fill="#38BDF8"/>

  <!-- Intelligent Core -->
  <circle cx="60" cy="58" r="5.6" fill="#00D4FF"/>
  <circle cx="60" cy="58" r="2.4" fill="#F8FAFC"/>
</svg>
