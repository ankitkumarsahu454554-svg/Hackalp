    <line x1="52" y1="53" x2="69.5" y2="37" stroke="#00D4FF" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
    <polygon points="52,37 66,45 66,61 52,69 38,61 38,45" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.3" fill="#0B1628" fill-opacity="0.65"/>
