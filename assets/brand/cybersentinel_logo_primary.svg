    <circle cx="52" cy="53" r="24" stroke="#00D4FF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3.5 3.5"/>
    <path d="M32.5 41.5 A22.5 22.5 0 0 1 71.5 41.5" stroke="#00D4FF" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round"/>
