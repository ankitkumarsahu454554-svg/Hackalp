    <circle cx="52" cy="37" r="2.2" fill="#E2E8F0"/>
    <circle cx="66" cy="45" r="2.1" fill="#00D4FF"/>
    <circle cx="66" cy="61" r="2.1" fill="#8B5CF6"/>
    <circle cx="52" cy="69" r="2.2" fill="#E2E8F0"/>
    <circle cx="38" cy="61" r="2.1" fill="#00D4FF"/>
    <circle cx="38" cy="45" r="2.1" fill="#38BDF8"/>
    <circle cx="52" cy="53" r="4.8" fill="#00D4FF"/>
    <circle cx="52" cy="53" r="2.0" fill="#F8FAFC"/>
