  <text x="115" y="79" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.2" fill="#94A3B8">TEMPORAL THREAT RADAR</text>
