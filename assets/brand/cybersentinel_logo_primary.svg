<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 108" width="460" height="108" fill="none" role="img" aria-label="CYBERSENTINEL AI — Temporal Threat Radar">
  <defs>
    <linearGradient id="pShieldFill" x1="16" y1="10" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#09101D"/>
    </linearGradient>
    <linearGradient id="pEdgeGrad" x1="14" y1="10" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
