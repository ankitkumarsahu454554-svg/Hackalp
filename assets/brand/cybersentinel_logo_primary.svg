  <!-- Wordmark -->
  <text x="114" y="48" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" letter-spacing="1.6" fill="#F8FAFC">CYBERSENTINEL</text>
  <rect x="356" y="27" width="38" height="24" rx="5" fill="#00D4FF" fill-opacity="0.14" stroke="#00D4FF" stroke-opacity="0.55" stroke-width="1.1"/>
